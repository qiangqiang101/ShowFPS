; ShowFPS Configuration File
; This file is automatically loaded and saved by ShowFPS.

[ShowFPS]
; 1 = Show overlay, 0 = Hide overlay
Enabled=1

; 1 = Show GPU utilization percentage (e.g. 60 GPU:84%), 0 = Hide GPU usage
ShowGpuUsage=1

; 1 = Show frametime in ms, 0 = Hide frametime
ShowFrameTime=0

; 1 = Show translucent background pill, 0 = Text with outline only (no background box)
ShowBackground=1

; Corner Position:
; 0 = Top-Left
; 1 = Top-Right (Recommended for FH2 to avoid map and speedometer)
; 2 = Bottom-Right
; 3 = Bottom-Left
Position=1

; 1 = Decimal FPS (e.g., 59.8 FPS), 0 = Integer FPS (e.g., 60 FPS)
Detailed=0

; Text Color Preset:
; 0 = Pure White
; 1 = Emerald Green
; 2 = Amber Yellow
; 3 = Sky Cyan
; 4 = Coral Red
; 5 = Dynamic (changes color based on FPS)
TextColorPreset=0

; 1 = Text color changes dynamically by FPS (Green >= 50, Yellow 30-49, Red < 30)
DynamicColor=0

; Font size in pixels (default 16, range 12 to 32)
FontSize=16

; Distance from window border in pixels (closer to screen edge)
MarginX=8
MarginY=6

; Background pill opacity (0 = transparent to 255 = solid, default 220)
BgAlpha=220

; Update interval in milliseconds (default 250 ms)
UpdateIntervalMs=250

; Virtual Key Code for toggle hotkey (122 = 0x7A = VK_F11)
ToggleHotkey=122
