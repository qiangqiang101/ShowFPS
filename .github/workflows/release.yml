name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The platform uses __try/__except, which MSVC rejects in some of its
      # functions; it is built with llvm-mingw (Clang), like every FH2 mod.
      - name: Install llvm-mingw
        shell: pwsh
        run: |
          $v = "20261020"
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/$v/llvm-mingw-$v-ucrt-x86_64.zip" -OutFile llvm-mingw.zip
          Expand-Archive llvm-mingw.zip -DestinationPath "$env:RUNNER_TEMP"
          "$env:RUNNER_TEMP\llvm-mingw-$v-ucrt-x86_64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Configure CMake
        shell: pwsh
        run: |
          python -m pip install ninja
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_TOOLCHAIN_FILE=platform/cmake/mingw-w64-x86_64.cmake"

      - name: Build and Package dist
        run: cmake --build build --target dist

      - name: Create Release Archive
        id: archive
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          if (-not $tag) {
            $tag = "v1.1.1"
          }
          $zipName = "ShowFPS-$tag.zip"
          Compress-Archive -Path "build\dist\*" -DestinationPath $zipName -Force
          echo "zip_name=$zipName" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ steps.archive.outputs.tag }} "${{ steps.archive.outputs.zip_name }}" --clobber

      - name: Upload Artifact (Manual Runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.zip_name }}
          path: ${{ steps.archive.outputs.zip_name }}
